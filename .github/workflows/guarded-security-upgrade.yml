name: OVIVO guarded security dependency update

on:
  push:
    branches: [feature/ai-first-three-demos]
    paths: ['.github/workflows/guarded-security-upgrade.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-first-three-demos
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install patched Next.js and update lockfile
        run: |
          npm install --save-exact next@15.5.28 eslint-config-next@15.5.28
          npm audit fix || true
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Record audit results (informational; separate security gate still enforced)
        run: npm audit --omit=dev --audit-level=high || true
      - name: Commit only if full application tests passed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: upgrade patched Next.js and compatible locked dependencies"
            git push origin HEAD:feature/ai-first-three-demos
          fi
